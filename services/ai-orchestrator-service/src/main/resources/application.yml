server:
  port: 8095

spring:
  application:
    name: ai-orchestrator-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shop_ai}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: AiHikariCP

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ai-orchestrator-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

ai:
  engine:
    model: "gemini-1.5-pro-preview"
    embedding-dimensions: 1536
    temperature: 0.7
    max-tokens: 2048
  agents:
    concierge:
      enabled: true
      max-tool-calls: 5
    bargaining:
      enabled: true
      max-discount-percent: 25.0
      margin-threshold-percent: 15.0
    fraud-radar:
      enabled: true
      high-risk-threshold: 75.0
    supply-chain:
      enabled: true
      reorder-lead-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
