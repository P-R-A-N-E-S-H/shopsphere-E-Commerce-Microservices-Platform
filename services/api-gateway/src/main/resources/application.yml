server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # Auth Service
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        # User Service
        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**

        # Product Service
        - id: product-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**, /api/v1/brands/**

        # Search Service
        - id: search-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/search/**

        # Cart Service
        - id: cart-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/cart/**

        # Wishlist Service
        - id: wishlist-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/wishlist/**

        # Inventory Service
        - id: inventory-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/inventory/**

        # Order Service
        - id: order-service
          uri: http://localhost:8088
          predicates:
            - Path=/api/v1/orders/**

        # Payment Service
        - id: payment-service
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/payments/**

        # Coupon Service
        - id: coupon-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/v1/coupons/**

        # Shipping Service
        - id: shipping-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/v1/shipping/**

        # Review Service
        - id: review-service
          uri: http://localhost:8092
          predicates:
            - Path=/api/v1/reviews/**

        # Notification Service
        - id: notification-service
          uri: http://localhost:8093
          predicates:
            - Path=/api/v1/notifications/**

        # Analytics Service
        - id: analytics-service
          uri: http://localhost:8094
          predicates:
            - Path=/api/v1/analytics/**

  data:
    redis:
      host: localhost
      port: 6379

jwt:
  secret: "ShopSphereSuperSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong!"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
