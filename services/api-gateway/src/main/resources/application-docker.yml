spring:
  config:
    activate:
      on-profile: docker
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: http://user-service:8082
          predicates:
            - Path=/api/v1/users/**
        - id: product-service
          uri: http://product-service:8083
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**, /api/v1/brands/**
        - id: search-service
          uri: http://search-service:8084
          predicates:
            - Path=/api/v1/search/**
        - id: cart-service
          uri: http://cart-service:8085
          predicates:
            - Path=/api/v1/cart/**
        - id: wishlist-service
          uri: http://wishlist-service:8086
          predicates:
            - Path=/api/v1/wishlist/**
        - id: inventory-service
          uri: http://inventory-service:8087
          predicates:
            - Path=/api/v1/inventory/**
        - id: order-service
          uri: http://order-service:8088
          predicates:
            - Path=/api/v1/orders/**
        - id: payment-service
          uri: http://payment-service:8089
          predicates:
            - Path=/api/v1/payments/**
        - id: coupon-service
          uri: http://coupon-service:8090
          predicates:
            - Path=/api/v1/coupons/**
        - id: shipping-service
          uri: http://shipping-service:8091
          predicates:
            - Path=/api/v1/shipping/**
        - id: review-service
          uri: http://review-service:8092
          predicates:
            - Path=/api/v1/reviews/**
        - id: notification-service
          uri: http://notification-service:8093
          predicates:
            - Path=/api/v1/notifications/**
        - id: analytics-service
          uri: http://analytics-service:8094
          predicates:
            - Path=/api/v1/analytics/**
  data:
    redis:
      host: redis
      port: 6379
